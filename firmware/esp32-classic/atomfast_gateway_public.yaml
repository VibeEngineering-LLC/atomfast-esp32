# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ AtomFast Gateway — PUBLIC RELEASE BUILD (v0.1.0)                         ║
# ║ Target: ESP32 Classic DevKit / WROOM-32 (arduino framework)              ║
# ║                                                                          ║
# ║ PUBLIC BUILD FEATURES:                                                   ║
# ║   • Captive portal: no hardcoded WiFi — user enters SSID via phone       ║
# ║   • Runtime BLE MAC: set via Web UI after flashing (no compile-time MAC) ║
# ║   • Narodmon switch: ALWAYS_OFF (never auto-sends without user action)   ║
# ║   • Web UI Basic Auth: admin / esphome (change after setup!)             ║
# ║   • BLE parser: 13-byte AtomFast ATOMTAG_MEASUREMENT (notify)            ║
# ║                                                                          ║
# ║ SETUP FLOW:                                                              ║
# ║   1. Flash firmware via esp32-flasher or esphome CLI.                   ║
# ║   2. Connect phone to "AtomFast-Classic Fallback" AP.                    ║
# ║   3. Captive portal opens — enter your WiFi credentials.                 ║
# ║   4. Open http://atomfast-gw-classic.local/ → Service → set BLE MAC.    ║
# ║   5. Press "Apply MAC and Reboot".                                       ║
# ║                                                                          ║
# ║ Base: atomfast_gateway.yaml v0.8.0-step4 (arduino, esp32-classic)        ║
# ╚══════════════════════════════════════════════════════════════════════════╝

substitutions:
  device_name: "atomfast-gw-classic"
  friendly_name: "AtomFast Gateway"
  fw_version: "v0.1.0"
  # AtomFast BLE: ATOMTAG_SERVICE + ATOMTAG_MEASUREMENT (notify)
  # Source: Am6er/atomswift/AtomDeviceNRF.java — UUID_MEASUREMENT, 13-byte payload.
  atomfast_service_uuid: "63462a4a-c28c-4ffd-87a4-2d23a1c72581"
  atomfast_char_uuid:    "70BC767E-7A1A-4304-81ED-14B9AF54F7BD"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.5.0
  name_add_mac_suffix: false
  on_boot:
    # priority -100: log version after all components init
    - priority: -100
      then:
        - logger.log:
            level: WARN
            format: "AtomFast Gateway ${fw_version} (arduino, 13B parser) booted"
    # priority -300: apply BLE MAC from NVS (runtime, set via Web UI)
    - priority: -300
      then:
        - lambda: |-
            auto parse_mac = [](const std::string &s) -> uint64_t {
              if (s.length() != 17) return 0;
              uint64_t m = 0;
              for (int i = 0; i < 6; i++) {
                char h[3] = { s[i*3], s[i*3+1], 0 };
                char *end = nullptr;
                long v = strtol(h, &end, 16);
                if (end == h || v < 0 || v > 255) return 0;
                m = (m << 8) | (uint8_t)v;
              }
              return m;
            };
            uint64_t m = parse_mac(id(mac_atomfast).state);
            if (m) {
              id(ble_atomfast).set_address(m);
              ESP_LOGI("boot", "AtomFast MAC applied from NVS: %s", id(mac_atomfast).state.c_str());
            } else {
              ESP_LOGW("boot", "AtomFast MAC not set or invalid — BLE will not connect. Set MAC via Web UI.");
            }

esp32:
  variant: esp32
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  power_save_mode: none
  output_power: 8.5dB
  ap:
    ssid: "AtomFast-Classic Fallback"
    password: !secret ap_password
  on_disconnect:
    - lambda: |-
        id(g_wifi_reassoc_count) += 1;
        ESP_LOGW("wifi", "WiFi disconnected — reassociations: %u", id(g_wifi_reassoc_count));

# Captive portal: when WiFi not found, AP starts and captive portal opens.
# User enters real WiFi credentials via phone browser.
captive_portal:

mdns:
  disabled: false

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

logger:
  level: INFO
  baud_rate: 115200

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

# HTTP client for Narodmon uploads (optional feature, switch is ALWAYS_OFF by default).
http_request:
  useragent: "esphome-atomfast/${fw_version}"
  timeout: 10s
  verify_ssl: false

# BLE tracker for ble_client connection to AtomFast.
esp32_ble_tracker:
  scan_parameters:
    # arduino HARD: 600ms/180ms (30% duty) — avoids INC-09 (rsn 0x3e) and INC-12 (Auth Expired).
    interval: 600ms
    window: 180ms
    active: true

globals:
  - id: g_notify_count
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: g_connect_count
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: g_disconnect_count
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: g_wifi_reassoc_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

# BLE client to AtomFast.
# MAC address is set at runtime via Web UI (mac_atomfast text entity + on_boot).
# Compile-time MAC from !secret atomfast_mac is only used as initial placeholder;
# on_boot overrides it with the user-configured value from NVS.
ble_client:
  - mac_address: !secret atomfast_mac
    id: ble_atomfast
    auto_connect: true
    on_connect:
      - lambda: |-
          id(g_connect_count) += 1;
          ESP_LOGI("atomfast", "===== AtomFast CONNECTED (#%u) =====", id(g_connect_count));
    on_disconnect:
      - lambda: |-
          id(g_disconnect_count) += 1;
          ESP_LOGW("atomfast", "AtomFast DISCONNECT #%u — auto_connect will retry.", id(g_disconnect_count));

web_server:
  version: 3
  port: 80
  log: false
  include_internal: false
  auth:
    username: !secret web_username
    password: !secret web_password
  sorting_groups:
    - id: sg_data
      name: "Sensor Data"
      sorting_weight: 5
    - id: sg_service
      name: "Service"
      sorting_weight: 10

# Runtime MAC configuration text entity.
# Set your AtomFast BLE MAC here (format: AA:BB:CC:DD:EE:FF, UPPERCASE).
# After setting, press "Apply MAC and Reboot".
text:
  - platform: template
    name: "AtomFast BLE MAC (AA:BB:CC:DD:EE:FF)"
    id: mac_atomfast
    optimistic: true
    restore_value: true
    initial_value: ""
    mode: text
    max_length: 17
    icon: "mdi:bluetooth"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 100

  - platform: template
    name: "Narodmon metric: intensity"
    id: nm_intensity
    optimistic: true
    restore_value: true
    mode: text
    initial_value: "R1"
    icon: "mdi:tag-text"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 230

  - platform: template
    name: "Narodmon metric: dose"
    id: nm_dose
    optimistic: true
    restore_value: true
    mode: text
    initial_value: "D1"
    icon: "mdi:tag-text"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 231

  - platform: template
    name: "Narodmon metric: temperature"
    id: nm_temp
    optimistic: true
    restore_value: true
    mode: text
    initial_value: "T1"
    icon: "mdi:tag-text"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 232

  - platform: template
    name: "Narodmon metric: battery"
    id: nm_batt
    optimistic: true
    restore_value: true
    mode: text
    initial_value: "BAT1"
    icon: "mdi:tag-text"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 233

button:
  - platform: safe_mode
    id: atomfast_safe_mode
    name: "Safe Mode Boot"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 80

  - platform: factory_reset
    id: atomfast_factory_reset
    name: "Factory Reset"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 90

  - platform: restart
    id: atomfast_reboot
    name: "Reboot"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 70

  - platform: template
    name: "Apply MAC and Reboot"
    id: mac_apply_reboot
    icon: "mdi:bluetooth-connect"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 105
    on_press:
      - lambda: "ESP_LOGI(\"mac\", \"Applying MAC: %s\", id(mac_atomfast).state.c_str());"
      - delay: 1s
      - lambda: "App.safe_reboot();"

  - platform: template
    name: "Reset BLE/WiFi counters"
    id: counters_reset
    icon: "mdi:counter"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 75
    on_press:
      - lambda: |-
          id(g_connect_count) = 0;
          id(g_disconnect_count) = 0;
          id(g_notify_count) = 0;
          id(g_wifi_reassoc_count) = 0;
          id(ble_connects).publish_state(0);
          id(ble_reconnects).publish_state(0);
          id(notify_count).publish_state(0);
          id(wifi_reassoc).publish_state(0);
          ESP_LOGW("atomfast", "===== BLE/WiFi counters reset =====");

  - platform: template
    name: "Send to Narodmon now"
    id: narodmon_send_now
    icon: "mdi:upload"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 210
    on_press:
      - script.execute: send_narodmon

# Narodmon switch: HARD ALWAYS_OFF — never auto-sends without explicit user action.
switch:
  - platform: template
    name: "Upload to Narodmon"
    id: narodmon_enabled
    icon: "mdi:cloud-upload"
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 200

select:
  - platform: template
    name: "Narodmon send method"
    id: narodmon_method
    icon: "mdi:upload-network"
    optimistic: true
    restore_value: true
    initial_option: "JSON POST"
    options:
      - "HTTP GET"
      - "HTTP POST"
      - "HTTPS POST"
      - "JSON POST"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 220

# Narodmon upload script (4 methods: HTTP GET / HTTP POST / HTTPS POST / JSON POST).
# Intensity is sent as µR/h (×100 from µSv/h). Dose as µSv (×1000 from mSv).
script:
  - id: send_narodmon
    then:
      - if:
          condition:
            and:
              - wifi.connected:
              - lambda: "return !std::isnan(id(intensity_uSv_h).state);"
          then:
            - if:
                condition:
                  lambda: 'return id(narodmon_method).state == "HTTP GET";'
                then:
                  - http_request.get:
                      url: !lambda |-
                        char url[384];
                        std::string mac = id(esp_mac).state;
                        mac.erase(std::remove(mac.begin(), mac.end(), ':'), mac.end());
                        float dose = std::isnan(id(dose_mSv).state) ? 0.0f : id(dose_mSv).state * 1000.0f;
                        float temp = std::isnan(id(temperature_C).state) ? 0.0f : id(temperature_C).state;
                        float batt = std::isnan(id(battery_pct).state)  ? 0.0f : id(battery_pct).state;
                        snprintf(url, sizeof(url),
                          "http://narodmon.ru/get?ID=%s&%s=%.4f&%s=%.4f&%s=%.0f&%s=%.0f",
                          mac.c_str(),
                          id(nm_intensity).state.c_str(), id(intensity_uSv_h).state * 100.0f,
                          id(nm_dose).state.c_str(),      dose,
                          id(nm_temp).state.c_str(),      temp,
                          id(nm_batt).state.c_str(),      batt);
                        return std::string(url);
                      capture_response: true
                      on_response:
                        then:
                          - lambda: |-
                              ESP_LOGI("narodmon", "GET HTTP %d: %s", response->status_code, body.c_str());
            - if:
                condition:
                  lambda: 'return id(narodmon_method).state == "HTTP POST";'
                then:
                  - http_request.post:
                      url: "http://narodmon.ru/post"
                      request_headers:
                        Content-Type: "application/x-www-form-urlencoded"
                      body: !lambda |-
                        char body[384];
                        std::string mac = id(esp_mac).state;
                        mac.erase(std::remove(mac.begin(), mac.end(), ':'), mac.end());
                        float dose = std::isnan(id(dose_mSv).state) ? 0.0f : id(dose_mSv).state * 1000.0f;
                        float temp = std::isnan(id(temperature_C).state) ? 0.0f : id(temperature_C).state;
                        float batt = std::isnan(id(battery_pct).state)  ? 0.0f : id(battery_pct).state;
                        snprintf(body, sizeof(body),
                          "ID=%s&%s=%.4f&%s=%.4f&%s=%.0f&%s=%.0f",
                          mac.c_str(),
                          id(nm_intensity).state.c_str(), id(intensity_uSv_h).state * 100.0f,
                          id(nm_dose).state.c_str(),      dose,
                          id(nm_temp).state.c_str(),      temp,
                          id(nm_batt).state.c_str(),      batt);
                        return std::string(body);
                      capture_response: true
                      on_response:
                        then:
                          - lambda: |-
                              ESP_LOGI("narodmon", "POST HTTP %d: %s", response->status_code, body.c_str());
            - if:
                condition:
                  lambda: 'return id(narodmon_method).state == "HTTPS POST";'
                then:
                  - http_request.post:
                      url: "https://narodmon.ru/post"
                      request_headers:
                        Content-Type: "application/x-www-form-urlencoded"
                      body: !lambda |-
                        char body[384];
                        std::string mac = id(esp_mac).state;
                        mac.erase(std::remove(mac.begin(), mac.end(), ':'), mac.end());
                        float dose = std::isnan(id(dose_mSv).state) ? 0.0f : id(dose_mSv).state * 1000.0f;
                        float temp = std::isnan(id(temperature_C).state) ? 0.0f : id(temperature_C).state;
                        float batt = std::isnan(id(battery_pct).state)  ? 0.0f : id(battery_pct).state;
                        snprintf(body, sizeof(body),
                          "ID=%s&%s=%.4f&%s=%.4f&%s=%.0f&%s=%.0f",
                          mac.c_str(),
                          id(nm_intensity).state.c_str(), id(intensity_uSv_h).state * 100.0f,
                          id(nm_dose).state.c_str(),      dose,
                          id(nm_temp).state.c_str(),      temp,
                          id(nm_batt).state.c_str(),      batt);
                        return std::string(body);
                      capture_response: true
                      on_response:
                        then:
                          - lambda: |-
                              ESP_LOGI("narodmon", "HTTPS POST HTTP %d: %s", response->status_code, body.c_str());
            - if:
                condition:
                  lambda: 'return id(narodmon_method).state == "JSON POST";'
                then:
                  - http_request.post:
                      url: "http://narodmon.ru/json"
                      request_headers:
                        Content-Type: "application/json"
                      body: !lambda |-
                        std::string mac = id(esp_mac).state;
                        mac.erase(std::remove(mac.begin(), mac.end(), ':'), mac.end());
                        float dose = std::isnan(id(dose_mSv).state) ? 0.0f : id(dose_mSv).state * 1000.0f;
                        float temp = std::isnan(id(temperature_C).state) ? 0.0f : id(temperature_C).state;
                        float batt = std::isnan(id(battery_pct).state)  ? 0.0f : id(battery_pct).state;
                        float intensity = std::isnan(id(intensity_uSv_h).state) ? 0.0f : id(intensity_uSv_h).state * 100.0f;
                        std::string body = "{\"devices\":[{\"mac\":\"" + mac + "\",\"sensors\":[";
                        body += "{\"id\":\"" + id(nm_intensity).state + "\",\"value\":" + std::to_string(intensity) + "},";
                        body += "{\"id\":\"" + id(nm_dose).state      + "\",\"value\":" + std::to_string(dose)      + "},";
                        body += "{\"id\":\"" + id(nm_temp).state      + "\",\"value\":" + std::to_string(temp)      + "},";
                        body += "{\"id\":\"" + id(nm_batt).state      + "\",\"value\":" + std::to_string(batt)      + "}";
                        body += "]}]}";
                        return body;
                      capture_response: true
                      on_response:
                        then:
                          - lambda: |-
                              ESP_LOGI("narodmon", "JSON POST HTTP %d: %s", response->status_code, body.c_str());
          else:
            - lambda: 'ESP_LOGW("narodmon", "skip: wifi=%d intensity_nan=%d", wifi::global_wifi_component->is_connected(), std::isnan(id(intensity_uSv_h).state));'

sensor:
  # AtomFast BLE notify parser (13-byte ATOMTAG_MEASUREMENT frame):
  #   byte 0     — flags (0x00 normal)
  #   bytes 1-4  — float32 LE: dose, mSv (accumulated)
  #   bytes 5-8  — float32 LE: intensity, µSv/h (dose rate)
  #   bytes 9-10 — uint16 LE: pulses_2s (pulses in 2s; CPS = /2)
  #   byte 11    — int8: battery, %
  #   byte 12    — int8: temperature, °C
  - platform: ble_client
    type: characteristic
    ble_client_id: ble_atomfast
    name: "AtomFast raw (debug)"
    id: raw_value_atomfast
    service_uuid: ${atomfast_service_uuid}
    characteristic_uuid: ${atomfast_char_uuid}
    notify: true
    update_interval: never
    internal: true
    lambda: |-
      id(g_notify_count) += 1;

      char hex[64]; size_t pos = 0;
      for (size_t i = 0; i < x.size() && pos + 3 < sizeof(hex); i++)
        pos += snprintf(hex + pos, sizeof(hex) - pos, "%02X ", x[i]);
      id(raw_notify).publish_state(std::string(hex));
      id(notify_count).publish_state((float) id(g_notify_count));

      if (x.size() != 13) {
        ESP_LOGW("atomfast", "notify len=%u (expected 13) — skip", (unsigned)x.size());
        return NAN;
      }

      float dose;
      memcpy(&dose, &x[1], 4);
      float intensity;
      memcpy(&intensity, &x[5], 4);

      // Guard: intensity must be finite and in [0, 1000)
      if (!std::isfinite(intensity) || intensity < 0 || intensity >= 1000) {
        ESP_LOGW("atomfast", "bad packet: intensity=%.4f out of [0,1000)", intensity);
        return NAN;
      }

      if (std::isfinite(dose) && dose >= 0)
        id(dose_mSv).publish_state(dose);
      id(intensity_uSv_h).publish_state(intensity);

      uint16_t pulses_2s = (uint16_t)x[9] | ((uint16_t)x[10] << 8);
      id(pulses_2s_sensor).publish_state((float) pulses_2s);
      id(cps_sensor).publish_state((float) pulses_2s / 2.0f);

      int8_t batt = (int8_t) x[11];
      id(battery_pct).publish_state((float) batt);

      int8_t temp = (int8_t) x[12];
      id(temperature_C).publish_state((float) temp);

      return NAN;
    filters:
      - filter_out: nan

  - platform: template
    name: "Notify count"
    id: notify_count
    accuracy_decimals: 0
    icon: "mdi:counter"
    update_interval: never
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 22

  - platform: template
    name: "Accumulated dose"
    id: dose_mSv
    unit_of_measurement: "mSv"
    accuracy_decimals: 4
    icon: "mdi:radioactive"
    update_interval: never
    device_class: ""
    web_server:
      sorting_group_id: sg_data
      sorting_weight: 2

  - platform: template
    name: "Dose rate"
    id: intensity_uSv_h
    unit_of_measurement: "µSv/h"
    accuracy_decimals: 4
    icon: "mdi:radioactive"
    update_interval: never
    web_server:
      sorting_group_id: sg_data
      sorting_weight: 3

  - platform: template
    name: "CPS (counts per second)"
    id: cps_sensor
    unit_of_measurement: "cps"
    accuracy_decimals: 1
    icon: "mdi:atom-variant"
    update_interval: never
    web_server:
      sorting_group_id: sg_data
      sorting_weight: 4

  - platform: template
    name: "Pulses per 2s"
    id: pulses_2s_sensor
    unit_of_measurement: "cps×2s"
    accuracy_decimals: 0
    icon: "mdi:counter"
    update_interval: never
    web_server:
      sorting_group_id: sg_data
      sorting_weight: 6

  - platform: template
    name: "Battery"
    id: battery_pct
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:battery"
    update_interval: never
    web_server:
      sorting_group_id: sg_data
      sorting_weight: 7

  - platform: template
    name: "Temperature"
    id: temperature_C
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    icon: "mdi:thermometer"
    update_interval: never
    web_server:
      sorting_group_id: sg_data
      sorting_weight: 8

  - platform: template
    name: "BLE connects"
    id: ble_connects
    accuracy_decimals: 0
    icon: "mdi:bluetooth-connect"
    update_interval: 10s
    lambda: "return (float) id(g_connect_count);"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 20

  - platform: template
    name: "BLE disconnects"
    id: ble_reconnects
    accuracy_decimals: 0
    icon: "mdi:bluetooth-off"
    update_interval: 10s
    lambda: "return (float) id(g_disconnect_count);"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 21

  - platform: template
    name: "WiFi reassociations"
    id: wifi_reassoc
    accuracy_decimals: 0
    icon: "mdi:wifi-refresh"
    update_interval: 10s
    lambda: "return (float) id(g_wifi_reassoc_count);"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 25

  - platform: uptime
    name: "Uptime"
    id: uptime_sec
    update_interval: 30s
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 20

  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 30s
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 30

  - platform: template
    name: "Free heap"
    id: free_heap
    accuracy_decimals: 0
    unit_of_measurement: "B"
    update_interval: 10s
    lambda: "return (float) esp_get_free_heap_size();"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 40

  - platform: template
    name: "Min free heap"
    id: min_free_heap
    accuracy_decimals: 0
    unit_of_measurement: "B"
    update_interval: 30s
    lambda: "return (float) esp_get_minimum_free_heap_size();"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 50

text_sensor:
  - platform: template
    name: "AtomFast raw notify (hex)"
    id: raw_notify
    icon: "mdi:hexadecimal"
    web_server:
      sorting_group_id: sg_data
      sorting_weight: 1

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_addr
      web_server:
        sorting_group_id: sg_service
        sorting_weight: 60
    ssid:
      name: "WiFi SSID"
      id: wifi_ssid_str
      web_server:
        sorting_group_id: sg_service
        sorting_weight: 61
    bssid:
      name: "WiFi BSSID"
      id: wifi_bssid_str
      web_server:
        sorting_group_id: sg_service
        sorting_weight: 62
    mac_address:
      name: "ESP MAC"
      id: esp_mac
      web_server:
        sorting_group_id: sg_service
        sorting_weight: 63

binary_sensor:
  - platform: template
    name: "BLE connected"
    id: ble_connected
    icon: "mdi:bluetooth"
    web_server:
      sorting_group_id: sg_data
      sorting_weight: 5
    lambda: "return id(ble_atomfast).connected();"

# Heartbeat LED: 100ms flash every 2s on GPIO2 (built-in blue LED on DevKitC).
output:
  - platform: gpio
    pin: GPIO2
    id: heartbeat_led

interval:
  - interval: 2s
    then:
      - output.turn_on: heartbeat_led
      - delay: 100ms
      - output.turn_off: heartbeat_led

  # WiFi watchdog: reboot if WiFi is down for more than 180s.
  - interval: 10s
    then:
      - lambda: |-
          static uint32_t wifi_down_since_ms = 0;
          if (wifi::global_wifi_component->is_connected()) {
            wifi_down_since_ms = 0;
          } else {
            if (wifi_down_since_ms == 0) wifi_down_since_ms = millis();
            uint32_t down_for = millis() - wifi_down_since_ms;
            if (down_for > 180000) {
              ESP_LOGE("watchdog", "WiFi down > 180s, rebooting");
              App.safe_reboot();
            }
          }

  # Narodmon auto-upload every 300s (min interval to avoid IP ban).
  # Only sends if switch is ON + WiFi connected + intensity is available.
  - interval: 300s
    then:
      - if:
          condition:
            and:
              - switch.is_on: narodmon_enabled
              - wifi.connected:
              - lambda: "return !std::isnan(id(intensity_uSv_h).state);"
          then:
            - logger.log:
                level: INFO
                format: "Narodmon: 300s auto-upload"
            - script.execute: send_narodmon
          else:
            - lambda: |-
                ESP_LOGD("narodmon", "300s skip: enabled=%d wifi=%d nan=%d",
                         id(narodmon_enabled).state,
                         wifi::global_wifi_component->is_connected(),
                         std::isnan(id(intensity_uSv_h).state));

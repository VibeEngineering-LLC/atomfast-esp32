<script>
'use strict';

const PAGE = document.documentElement.getAttribute('data-page') || 'history';

const SERIES = [
  {id:'rate',   group:'dose',  name:'Мощность дозы',      unit:'мкЗв/ч',  field:'doserate_usvh', axis:'L', color:'--s1', dash:[],        on:true},
  {id:'cps',    group:'count', name:'CPS',                unit:'имп/с',   field:'cps',           axis:'R', color:'--s2', dash:[],        on:true},
  {id:'pulses', group:'count', name:'Импульсы за 2 с',    unit:'имп/2 с', field:'pulses_2s',     axis:'R', color:'--s3', dash:[6,4],     on:false},
  {id:'temp',   group:'temp',  name:'Температура прибора',      unit:'°C',      field:'temp_c',        axis:'R', color:'--s5', dash:[10,3,2,3],on:false},
  {id:'air_t',  group:'temp',  name:'Температура среды', unit:'°C',      field:'air_t',         envKind:'t', cid:'air_t', axis:'R', color:'--s6', dash:[8,3],     on:false, dec:1},
  {id:'air_p',  group:'press', name:'Давление среды',         unit:'мм рт. ст.', field:'air_p',      envKind:'p', cid:'air_p', axis:'R', color:'--s7', dash:[3,2],     on:false, dec:1},
  {id:'air_h',  group:'hum',   name:'Влажность среды',        unit:'%',          field:'air_h',      envKind:'h', cid:'air_h', axis:'R', color:'--s8', dash:[16,5],    on:false, dec:1}
  // Воздух (BMP280): ряды air_t/air_p приходят отдельным видом kind=env и привязываются к строкам по времени (AFS.mergeEnv).
];

initColors();
const MAX_RAW_ROWS = 4000;
const MAX_AGG_ROWS = 21000;
const POLL_MS = 5000;
const STATUS_MS = 30000;
const FETCH_TIMEOUT = 15000;

const LS_KEY = 'afh.history.v1';

const state = {
  kind: 'raw',
  windowSec: 3600,
  vis: {},
  axis: {},
  rows: [],
  unknown: 0,
  lastSeq: 0,
  epoch: null,
  view: null,
  prevFull: null,
  busy: false,
  capped: false,
  rateRaw: 0.5,
  errors: [],
  pill: {cls:'', text:'…'}
};

// ---- helpers ----
function offMin(){ try { return new Date(Date.now()).getTimezoneOffset(); } catch(e){ return 0; } }
function cssVar(name){
  try {
    const i = String(name).indexOf('|');
    if (i < 0) return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const bg = cssVar('--bg');
    const dark = AFCL.hexOk(bg) && AFCL.luminance(bg) < 0.4;
    return AFCL.tint(cssVar(name.slice(0, i)), Number(name.slice(i + 1)), dark ? 'dark' : 'light');
  }
  catch(e){ return '#888'; }
}
function fmtCompact(v, dec){
  if (v == null || !isFinite(v)) return '—';
  if (dec != null) return Number(v).toFixed(dec); // e10: для давления и температуры воздуха важен десятый знак
  let s = Number(v).toPrecision(3);
  if (s.indexOf('e') >= 0 || s.indexOf('E') >= 0) return s;
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/,'').replace(/\.$/,'');
  return s;
}
function decOf(id){ const d = SERIES.find(x => x.id === id); return d ? d.dec : null; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function loadLS(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return null;
}
function saveLS(){
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      kind: state.kind, windowSec: state.windowSec, vis: state.vis, axis: state.axis
    }));
  } catch(e){}
}
function defaultState(){
  const vis = {}, axis = {};
  for (const s of SERIES){ vis[s.id] = s.on; axis[s.id] = s.axis; }
  return {vis, axis};
}

// ряды датчиков среды: перестраиваются по списку датчиков из CSV (E7b)
let envSig = '';
function syncEnvSeries(envRows) {
  const next = AFES.build(envRows);
  const sig = AFES.signature(next);
  if (sig === envSig) return false;
  const kindOn = {t: false, p: false, h: false};
  for (const d of SERIES) if (d.envKind && state.vis[d.id]) kindOn[d.envKind] = true;
  const kept = SERIES.filter(d => !d.envKind);
  for (const d of SERIES) if (d.envKind) { delete state.vis[d.id]; delete state.axis[d.id]; }
  SERIES.splice(0, SERIES.length, ...kept, ...next);
  for (const d of next) { if (state.vis[d.id] === undefined) state.vis[d.id] = kindOn[d.envKind]; if (state.axis[d.id] === undefined) state.axis[d.id] = d.axis; }
  envSig = sig;
  if (typeof clApply === 'function') clApply();
  if (PAGE === 'history' && document.getElementById('legend')) buildLegend();
  return true;
}
function applyEnv(rows) { syncEnvSeries(state.env); return AFS.mergeEnv(rows, state.env, 120); }

// ---- fetch with timeout ----
async function fetchRead(url, opts, readResponse){
  const ctrl = new AbortController();
  const signal = opts && opts.signal;
  const abort = () => ctrl.abort();
  if (signal) {
    if (signal.aborted) ctrl.abort();
    else signal.addEventListener('abort', abort, {once:true});
  }
  const t = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT);
  try {
    const o = Object.assign({credentials:'same-origin', cache:'no-store'}, opts||{});
    o.signal = ctrl.signal;
    const r = await fetch(url, o);
    if (r.status === 401) { const e = new Error('401'); e.status = 401; throw e; }
    if (!r.ok) { const e = new Error('HTTP '+r.status); e.status = r.status; throw e; }
    return await readResponse(r);
  } finally {
    clearTimeout(t);
    if (signal) signal.removeEventListener('abort', abort);
  }
}
async function fetchJSON(url, opts){
  return fetchRead(url, opts, r => r.json());
}
async function fetchText(url, opts){
  return fetchRead(url, opts, async r => {
    const dsh = r.headers.get('X-AF-Ds');   // "next=<seq>;bucket=<n>" - только у прореженного ответа (pts)
    const nm = dsh ? /next=(\d+)/.exec(dsh) : null;
    return {text: await r.text(), seq: r.headers.get('X-AF-Seq'), next: nm ? nm[1] : null, ds: !!dsh};
  });
}

// ---- pill ----
function setPill(cls, text){
  state.pill = {cls, text};
  const p = document.getElementById('pill');
  p.className = 'pill ' + cls;
  document.getElementById('pillText').textContent = text;
}
function pillOk(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  setPill('ok', 'обновлено ' + p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()));
}
function pillErr(e){
  if (e && e.status === 401) setPill('warn', 'нужна авторизация');
  else setPill('bad', 'нет связи с платой');
}

// ---- data loading ----
async function fullLoad(){
  if (state.range) { loadRange(); return; }
  if (state.busy) return;
  state.busy = true;
  state.ovr = null; state.zl = null;   // e16g: обзорная загрузка отменяет детальную (зум)
  zlSeq++; if (zlTimer) { clearTimeout(zlTimer); zlTimer = null; }   // T-57 P2-5: устаревший ответ зума отбрасывается по номеру запроса
  try {
    const status = await fetchJSON('/api/history/status');
    aggWindow = AFAG.windowOf(status);
    lastHistStatus = status;
    renderDisk(status);
    renderKindNote();
    // e16e (T-34): вид (сырые/агрегаты) выбирается автоматически по окну и ширине графика; плата прореживает ряд по числу точек (pts)
    // e16g (T-46/T-49): шаг = окно / ширина; < 60 с - сырые, иначе агрегаты; не хватает агрегатов - сырые (AFZP.pick)
    const nowT = status.now_ts || Math.floor(Date.now() / 1000);
    const rr = state.rateRaw || 0.5;
    const wsec = state.windowSec > 0 ? state.windowSec : (Math.max(((status.raw || {}).count || 0) / rr, ((status.agg || {}).count || 0) * (status.window_s || 60)) || 3600);
    const pick = AFZP.pick({ from: nowT - wsec, to: nowT, widthPx: canvas.clientWidth, status: status, rawRate: rr });
    pick.from = state.windowSec > 0 ? nowT - wsec : null;
    state.kind = pick.kind;
    const ring = status[state.kind] || {};
    const maxRows = state.kind === 'raw' ? MAX_RAW_ROWS : MAX_AGG_ROWS;
    const rate = state.kind === 'raw' ? (state.rateRaw || 0.5) : (status.window_s ? 1/status.window_s : 0);
    const since = AFH.sinceFor(ring, state.windowSec, rate, maxRows);
    const url = pick.pts > 0
      ? '/api/history.csv?kind=' + state.kind + '&pts=' + pick.pts + (pick.from ? '&from=' + pick.from : '') + '&limit=200000'
      : '/api/history.csv?kind=' + state.kind + '&since=' + since + '&limit=' + maxRows;
    const res = await fetchText(url);
    if (state.range) return;
    const parsed = AFH.parseCsv(res.text);
    if (state.kind === 'raw' && parsed.rows.length && !res.ds) state.rateRaw = AFH.ratePerSec(parsed.rows);
    const split = AFH.splitKnown(parsed.rows);
    state.unknown = split.unknown;
    let rows = split.known;
    if (state.windowSec > 0) rows = AFH.windowRows(rows, state.windowSec);
    try { await syncEnv(status, true); } catch(e){ state.env = []; state.envSeq = 0; state.envEpoch = null; }
    if (state.range) return;
    applyEnv(rows);
    state.rows = rows;
    state.lastSeq = (res.ds && res.next !== null && isFinite(Number(res.next))) ? Number(res.next) : AFH.nextSince(since, ring.oldest, parsed.rows.length + parsed.bad);
    state.epoch = ring.epoch;
    state.capped = !res.ds && (since > ring.oldest) && state.windowSec === 0;
    state.errors = [];
    if (parsed.bad) state.errors.push('Пропущено строк с ошибками: ' + parsed.bad);
    const full = AFS.fullRange(rows);
    if (full) {
      if (!state.view || (state.prevFull && state.view.t0 === state.prevFull.t0 && state.view.t1 === state.prevFull.t1)) {
        state.view = {t0: full.t0, t1: full.t1};
      }
      state.prevFull = {t0: full.t0, t1: full.t1};
    } else {
      state.view = null; state.prevFull = null;
    }
    pillOk();
    renderStore(status);
    redraw();
  } catch(e){
    pillErr(e);
  } finally {
    state.busy = false;
  }
}

async function poll(){
  if (state.range) return; // poll: в режиме интервала автообновления нет
  if (state.ovr) return;   // e16g: пока график приближен, обзор не дописываем
  if (state.busy) return;
  if (document.visibilityState !== 'visible') return;
  state.busy = true;
  try {
    const status = await fetchJSON('/api/history/status');
    aggWindow = AFAG.windowOf(status);
    lastHistStatus = status;
    renderDisk(status);
    renderKindNote();
    const ring = status[state.kind] || {};
    if (ring.seq < state.lastSeq || ring.epoch !== state.epoch) {
      await fullLoad();
      return;
    }
    let envChanged = false;
    try { envChanged = await syncEnv(status, false); } catch(e){ envChanged = false; }
    if (state.range) return;
    if (ring.seq > state.lastSeq) {
      const maxRows = state.kind === 'raw' ? MAX_RAW_ROWS : MAX_AGG_ROWS;
      const url = '/api/history.csv?kind=' + state.kind + '&since=' + state.lastSeq + '&limit=2000';
      const res = await fetchText(url);
      if (state.range) return;
    if (state.range) return;
      const parsed = AFH.parseCsv(res.text);
      if (state.kind === 'raw' && parsed.rows.length) state.rateRaw = AFH.ratePerSec(parsed.rows);
      const split = AFH.splitKnown(parsed.rows);
      state.unknown += split.unknown;
      let rows = AFH.appendRows(state.rows, split.known, maxRows);
      if (state.windowSec > 0) rows = AFH.windowRows(rows, state.windowSec);
      applyEnv(rows);
      state.rows = rows;
      state.lastSeq = AFH.nextSince(state.lastSeq, ring.oldest, parsed.rows.length + parsed.bad);
      const full = AFS.fullRange(rows);
      if (full) {
        if (state.prevFull && state.view && state.view.t0 === state.prevFull.t0 && state.view.t1 === state.prevFull.t1) {
          state.view = {t0: full.t0, t1: full.t1};
        }
        state.prevFull = {t0: full.t0, t1: full.t1};
      }
      pillOk();
      renderStore(status);
      redraw();
    } else {
      if (envChanged) { applyEnv(state.rows); redraw(); }
      pillOk();
      renderStore(status);
    }
  } catch(e){
    pillErr(e);
  } finally {
    state.busy = false;
  }
}

function spanOf(rows){
  if (!rows || rows.length < 2) return null;
  let t0 = Infinity, t1 = -Infinity;
  for (const r of rows){ if (r.ts < t0) t0 = r.ts; if (r.ts > t1) t1 = r.ts; }
  if (!isFinite(t0) || !isFinite(t1)) return null;
  return Math.max(0, t1 - t0);
}

canvas.addEventListener('keydown', e => {
  const off = offMin();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    if (!state.rows.length) return;
    let idx;
    if (cursor) idx = cursor.index;
    else { const full = AFS.fullRange(state.rows); idx = AFS.nearestIndex(state.rows, full ? (full.t0+full.t1)/2 : state.rows[0].ts); }
    idx += (e.key === 'ArrowRight' ? 1 : -1);
    idx = Math.max(0, Math.min(state.rows.length - 1, idx));
    setCursorFromTime(state.rows[idx].ts, true);
  } else if (e.key === 'Escape') {
    const full = AFS.fullRange(state.rows);
    if (full) state.view = {t0: full.t0, t1: full.t1};
    cursor = null; redraw();
  } else if (e.key === '+' || e.key === '=' || e.key === '-') {
    e.preventDefault();
    const full = AFS.fullRange(state.rows);
    if (!full) return;
    const c = (state.view ? (state.view.t0+state.view.t1)/2 : (full.t0+full.t1)/2);
    const factor = (e.key === '+' || e.key === '=') ? 0.8 : 1.25;
    let nv = AFS.zoomRange(state.view ? state.view.t0 : full.t0, state.view ? state.view.t1 : full.t1, c, factor, 10);
    nv.t0 = Math.max(nv.t0, full.t0); nv.t1 = Math.min(nv.t1, full.t1);
    state.view = nv; redraw();
  }
});

const MAX_ENV_ROWS = 5000;
state.env = [];

state.envEpoch = null;

async function syncEnv(status, full) {
  const ring = status && status.env;
  if (!ring || typeof ring !== 'object') {
    state.env = [];
    state.envSeq = 0;
    state.envEpoch = null;
    return false;
  }
  if (!full && ring.epoch === state.envEpoch && ring.seq >= state.envSeq) {
    if (ring.seq === state.envSeq) return false;
    const res = await fetchText('/api/history.csv?kind=env&since=' + state.envSeq + '&limit=500');
    const p = AFS.parseEnvCsv(res.text);
    state.env = AFH.appendRows(state.env, p.rows, MAX_ENV_ROWS);
    state.envSeq = AFH.nextSince(state.envSeq, ring.oldest, p.rows.length + p.bad);
    return true;
  }
  const since = AFH.sinceFor(ring, state.windowSec, 1/30, MAX_ENV_ROWS);
  const res = await fetchText('/api/history.csv?kind=env&since=' + since + '&limit=' + MAX_ENV_ROWS);
  const p = AFS.parseEnvCsv(res.text);
  state.env = p.rows;
  state.envSeq = AFH.nextSince(since, ring.oldest, p.rows.length + p.bad);
  state.envEpoch = ring.epoch;
  return true;
}

async function postJSON(url, body) {
  const tokenRes = await fetchJSON('/api/csrf-token');
  const token = tokenRes.token;
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 15000);
  try {
    const r = await fetch(url, {
      method: 'POST',
      credentials: 'same-origin',
      cache: 'no-store',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': token
      },
      body: JSON.stringify(body || {}),
      signal: controller.signal
    });
    let data = null;
    try {
      data = await r.json();
    } catch (e) {
      data = null;
    }
    return { ok: r.ok, status: r.status, data };
  } finally {
    clearTimeout(timeoutId);
  }
}

let mqDirty = false;
let mqFilled = false;
let mqBusy = false;

function mqSetResult(cls, text) {
    const el = document.getElementById('mqResult');
    el.className = 'result ' + cls;
    el.textContent = text;
}

async function mqLoad() {
    if (mqBusy) return;
    mqBusy = true;
    try {
        const j = await fetchJSON('/api/mqtt');
        const active = document.activeElement;
        const ids = ['mqEnabled', 'mqHost', 'mqPort', 'mqUser', 'mqPass', 'mqPassClear', 'mqPeriod', 'mqPrefix'];
        const isFocusInBlock = active && ids.includes(active.id);
        if ((!mqFilled || !mqDirty) && !isFocusInBlock) {
            document.getElementById('mqEnabled').checked = !!j.enabled;
            document.getElementById('mqHost').value = j.host;
            document.getElementById('mqPort').value = String(j.port);
            document.getElementById('mqUser').value = j.user;
            document.getElementById('mqPeriod').value = String(j.period_s);
            document.getElementById('mqPrefix').value = j.prefix;
            document.getElementById('mqPass').value = '';
            document.getElementById('mqPassClear').checked = false;
            document.getElementById('mqPassHint').textContent = j.pass_set ? 'пароль задан (оставьте поле пустым, чтобы не менять)' : 'пароль не задан';
            mqFilled = true;
            mqDirty = false;
        }
    } catch (e) {
        document.getElementById('mqState').textContent = (e && e.status === 401) ? 'Нужна авторизация' : 'Нет связи с платой';
    } finally {
        mqBusy = false;
    }
}

async function mqLoadState() {
    try {
        const j = await fetchJSON('/api/status');
        const m = j.mqtt;
        const el = document.getElementById('mqState');
        if (!m) {
            el.textContent = 'MQTT: нет данных';
            return;
        }
        if (!m.enabled) {
            el.textContent = 'MQTT выключен';
            return;
        }
        if (m.connected) {
            el.textContent = 'MQTT подключён, отправлено ' + m.published + ', ошибок отправки ' + m.failed;
            return;
        }
        const map = {
            no_host: 'не задан адрес брокера',
            transport: 'нет соединения с брокером',
            auth: 'брокер отклонил логин/пароль',
            publish: 'ошибка отправки',
            init: 'ошибка запуска клиента'
        };
        const reason = m.last_err ? (map[m.last_err] || m.last_err) : '';
        el.textContent = 'MQTT не подключён' + (reason ? ' (' + reason + ')' : '');
    } catch (e) {
        // тихо игнорируем ошибки сети
    }
}

function mqBuildBody() {
    const enabled = document.getElementById('mqEnabled').checked;
    const host = document.getElementById('mqHost').value.trim();
    const portStr = document.getElementById('mqPort').value.trim();
    const user = document.getElementById('mqUser').value;
    const pass = document.getElementById('mqPass').value;
    const passClear = document.getElementById('mqPassClear').checked;
    const periodStr = document.getElementById('mqPeriod').value.trim();
    const prefix = document.getElementById('mqPrefix').value;

    // Проверка host
    if (enabled) {
        if (!host) return { ok: false, error: 'Укажите адрес брокера', field: 'mqHost' };
        if (host.length > 63) return { ok: false, error: 'Адрес брокера слишком длинный', field: 'mqHost' };
        if (!/^[A-Za-z0-9._-]+$/.test(host)) return { ok: false, error: 'Недопустимые символы в адресе брокера', field: 'mqHost' };
    }

    // Проверка port
    if (!/^\d+$/.test(portStr)) return { ok: false, error: 'Порт должен быть целым числом', field: 'mqPort' };
    const port = parseInt(portStr, 10);
    if (port < 1 || port > 65535) return { ok: false, error: 'Порт должен быть от 1 до 65535', field: 'mqPort' };

    // Проверка period_s
    if (!/^\d+$/.test(periodStr)) return { ok: false, error: 'Период должен быть целым числом', field: 'mqPeriod' };
    const period = parseInt(periodStr, 10);
    if (period < 10 || period > 3600) return { ok: false, error: 'Период должен быть от 10 до 3600 секунд', field: 'mqPeriod' };

    // Проверка prefix
    if (!/^[a-z0-9_\/-]{1,32}$/.test(prefix)) return { ok: false, error: 'Недопустимый префикс', field: 'mqPrefix' };
    if (prefix.startsWith('/') || prefix.endsWith('/')) return { ok: false, error: 'Префикс не может начинаться или заканчиваться на /', field: 'mqPrefix' };

    // Проверка user
    if (user.length > 31) return { ok: false, error: 'Имя пользователя слишком длинное', field: 'mqUser' };
    for (let i = 0; i < user.length; i++) {
        const c = user.charCodeAt(i);
        if (c < 0x20 || c > 0x7E) return { ok: false, error: 'Имя пользователя содержит недопустимые символы', field: 'mqUser' };
    }

    // Проверка pass
    if (pass.length > 63) return { ok: false, error: 'Пароль слишком длинный', field: 'mqPass' };
    for (let i = 0; i < pass.length; i++) {
        const c = pass.charCodeAt(i);
        if (c < 0x20 || c > 0x7E) return { ok: false, error: 'Пароль содержит недопустимые символы', field: 'mqPass' };
    }

    const body = {
        enabled: enabled,
        host: host,
        port: port,
        user: user,
        period_s: period,
        prefix: prefix
    };

    // Добавляем pass только если поле заполнено или стоит флаг очистки
    if (pass !== '' || passClear) {
        body.pass = passClear ? '' : pass;
    }

    return { ok: true, body: body };
}

async function mqSave() {
    const v = mqBuildBody();
    if (!v.ok) {
        mqSetResult('bad', v.error);
        const el = document.getElementById(v.field);
        if (el) el.focus();
        return;
    }

    const btn = document.getElementById('btnMqSave');
    btn.disabled = true;
    mqSetResult('', 'сохраняю…');

    try {
        const r = await postJSON('/api/mqtt', v.body);
        if (r.ok) {
            const msg = (r.data && r.data.persisted === false) ? 'применено, но не записано в память платы (действует до перезагрузки)' : 'сохранено';
            mqSetResult('ok', msg);
            mqDirty = false;
            mqFilled = false;
            await mqLoad();
            await mqLoadState();
        } else {
            let errText = 'плата отклонила значения';
            if (r.status === 401) errText = 'нужна авторизация';
            else if (r.status === 403) errText = 'отказ: недействительный токен, обновите страницу';
            mqSetResult('bad', errText);
        }
    } catch (e) {
        mqSetResult('bad', 'нет связи с платой');
    } finally {
        btn.disabled = false;
        // Всегда очищаем поле пароля после попытки сохранения
        document.getElementById('mqPass').value = '';
    }
}

function initMqttUi() {
    const btn = document.getElementById('btnMqSave');
    btn.addEventListener('click', mqSave);

    const fieldIds = ['mqEnabled', 'mqHost', 'mqPort', 'mqUser', 'mqPass', 'mqPassClear', 'mqPeriod', 'mqPrefix'];
    fieldIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener('input', () => { mqDirty = true; });
            el.addEventListener('change', () => { mqDirty = true; });
        }
    });

    mqLoad();
    mqLoadState();

    setInterval(() => {
        if (document.visibilityState === 'visible') {
            mqLoadState();
        }
    }, 10000);
}

(function init(){
  const saved = loadLS();
  const d = defaultState();
  if (saved) {
    if (typeof saved.windowSec === 'number') state.windowSec = saved.windowSec;
    if (saved.kind === 'raw' || saved.kind === 'agg') state.kind = saved.kind;
    if (saved.vis) for (const k in d.vis) if (k in saved.vis) state.vis[k] = saved.vis[k];
    if (saved.axis) for (const k in d.axis) if (k in saved.axis) state.axis[k] = saved.axis[k];
  } else {
    state.vis = d.vis; state.axis = d.axis;
  }
  // e10: ряды, которых нет в сохранённых настройках (новые), берут значения по умолчанию; ось ряда = сохранённая ось
  for (const s of SERIES) {
    if (state.vis[s.id] === undefined) state.vis[s.id] = s.on;
  }
  if (PAGE !== 'measure') {
    const mv = document.getElementById('measureView');
    if (mv) mv.remove();
  }
  if (PAGE !== 'system') {
    // формы и разделы системы живут только на /system: на других страницах их узлов нет вовсе
    const sv = document.querySelector('[data-view~="system"]');
    if (sv) sv.remove();
  }
  loadAxesLS();
  initFontUi();
  try {
    const vp = new URLSearchParams(location.search).get('vis'); // ?vis=rate,cps,... preselects series (testing, screenshots)
    if (vp) { const on = vp.split(','); for (const s of SERIES) state.vis[s.id] = on.indexOf(s.id) !== -1; }
  } catch (e) {}
  try {
    const wp = parseInt(new URLSearchParams(location.search).get('win'), 10); // ?win=86400 (testing, screenshots), 0 = вся история
    if (wp >= 0) { state.windowSec = wp; state.kind = defaultKindForWindow(wp); }
  } catch (e) {}
  if (PAGE === 'history') {
    setSeg(document.getElementById('segWin'), state.windowSec, 'data-win');
    setSeg(document.getElementById('segKind'), state.kind, 'data-kind');
    renderKindNote();
    buildLegend();

    }, POLL_MS);
  } else if (PAGE === 'settings') {
    loadSensors();

      if (document.visibilityState === 'visible') loadSensors();

  } else if (PAGE === 'measure') {
    initMeasure();
  } else if (PAGE === 'system') {

    initMqttUi();

    setInterval(() => {
      if (document.visibilityState === 'visible') loadTime();
    }, STATUS_MS);
    initMaintUi();
    initFirmwareUi();
    initBoardFw();
    initSystemView();
  }
  initMeasBadge();
})();
